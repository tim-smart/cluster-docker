apiVersion: apps/v1
kind: Deployment
metadata:
  name: speed-shooter
  namespace: speed-shooter
spec:
  replicas: 0
  selector:
    matchLabels:
      app: speed-shooter
  template:
    metadata:
      labels:
        app: speed-shooter
    spec:
      containers:
        - name: speed-shooter
          image: timsmart/effect-cluster:runner
          ports:
            - containerPort: 34431
              name: tcp
          args:
            - node
            - ed-speed-shooter.js
          imagePullPolicy: Always
          env:
            - name: DB_HOST
              value: mysql.mysql.svc
            - name: DB_PORT
              value: '3306'
            - name: DB_DATABASE
              value: effect_cluster
            - name: DB_USER
              value: cluster
            - name: DB_PASSWORD
              value: cluster
            - name: SHARD_MANAGER_HOST
              value: shard-manager.shard-manager.svc
            - name: HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
